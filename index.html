<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#080c11" />
<title>Clayton Boat Tours — Provisioning</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" />
<!-- brand.css owns every colour and the type stack; styles.css states none of
     its own. It loads first so the tokens exist before anything uses them. -->
<link rel="stylesheet" href="css/brand.css" />
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="app">
    <aside class="side">
      <div class="side-brand">
        <!-- js/brand.js draws the mark and fills the name; these are fallbacks. -->
        <span class="house-mark"></span>
        <div>
          <div class="brand-name">Clayton Boat Tours</div>
          <div class="brand-tag">Provisioning</div>
        </div>
      </div>
      <nav class="side-nav" id="nav" aria-label="Sections"></nav>
      <div class="side-foot" id="side-foot"></div>
    </aside>

    <main class="main">
      <!-- Food cost, bar cost, inventory value and low stock, on every page. -->
      <header class="kpi-bar" id="kpis"></header>
      <div class="page" id="page"></div>
    </main>
  </div>

  <div id="modal-overlay" class="modal-overlay" hidden>
    <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-header">
        <h2 id="modal-title">Title</h2>
        <button class="modal-close" id="modal-close" aria-label="Close">&times;</button>
      </div>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>

  <div id="toast" class="toast" role="status" hidden></div>

  <script src="js/brand.js"></script>
  <script src="js/core.js"></script>

  <!-- Data. Locations load first: every quantity map is keyed by them. -->
  <script src="js/fleet/storage.js"></script>
  <script src="js/catering/calc.js"></script>
  <script src="js/catering/storage.js"></script>
  <script src="js/bar/calc.js"></script>
  <script src="js/bar/storage.js"></script>

  <!-- Pages. -->
  <script src="js/ui/store.js"></script>
  <script src="js/ui/widgets.js"></script>
  <script src="js/ui/inventory.js"></script>
  <script src="js/ui/menu.js"></script>
  <script src="js/ui/catering.js"></script>
  <script src="js/ui/locations.js"></script>
  <script src="js/ui/shell.js"></script>
</body>
</html>
